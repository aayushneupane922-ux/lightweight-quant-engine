[project]
name = "lightweight-quant-engine"
version = "3.0.0"
description = "Local, paper-only, autonomous quant-research simulator."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",       # MIT — config/schema validation, events
  "structlog",         # Apache-2.0/MIT — structured audit logging
  "ccxt",              # MIT — crypto market data (public endpoints only, M2)
  "duckdb",            # MIT — local OLAP catalog over Parquet (M2)
  "pyarrow",           # Apache-2.0 — Parquet/Arrow storage (M2)
  "tzdata",            # Apache-2.0/public-domain (CLDR) — IANA tz database;
                       # required by zoneinfo on platforms with no system
                       # tz database (Windows), needed to round-trip UTC
                       # timestamps through pyarrow/Parquet
  "numpy",             # BSD-3 — self-contained DSR/PBO/metrics math (M4), indicators (M6)
]

# The rest of the docs/07 (Cost, Stack & Local LLM) stack lands milestone-by-
# milestone as the modules that need it are built. Declared here for
# reference/pin-planning; not imported by src/lqe until its owning milestone.
#
# pandas-ta (MIT) was evaluated for M6 and rejected: it hard-requires tqdm,
# which is dual-licensed MPL-2.0/MIT with the bulk of its files under
# MPL-2.0 — weak copyleft, not on the MIT/BSD/Apache/NCSA allowlist
# (CLAUDE.md non-negotiable #8). Indicators are implemented natively
# instead (models/adapters/indicator_rule_adapter.py, numpy-only, "own"
# license per docs/03's manifest convention).
[project.optional-dependencies]
data = [
  "polars",            # MIT — fast dataframes, once a milestone needs vectorized transforms
  "pandas",            # BSD-3
]
models = [
  "statsmodels",       # BSD-3 — StatsmodelsPairsAdapter (M6), scaled in M11
  "arch",              # NCSA — ArchVolAdapter (M6), scaled in M11
  "hmmlearn",          # BSD-3 — regime detection (M11)
  "ruptures",          # BSD-2 — change-point detection (M11)
  "skfolio",           # BSD-3 — SkfolioOptimizerAdapter (M6), scaled in M11
  "PyPortfolioOpt",    # MIT — PyPortfolioOptAdapter (M6)
  "riskfolio-lib",     # BSD-3 — RiskfolioAdapter (M6)
  "scikit-learn",      # BSD-3 — supervised signals/meta-labeling (M11)
  "lightgbm",          # MIT — gradient boosting (M11)
  "river",             # BSD-3 — online learning / drift monitor (M8)
]
# The five heavy-lib structural adapters above (models/adapters/*_adapter.py)
# lazily import their library only at construction time, so a base or `dev`
# install never needs them; intake_check() quarantines cleanly (with the
# ImportError as the reason) if `.[models]` isn't installed.
search = [
  "optuna",            # MIT — hyperparameter search (M8)
]
# nicegui (MIT) was evaluated for M7 and rejected: importing it alone
# unconditionally loads python-socketio -> bidict and nicegui's own
# docutils dependency, and `docutils`'s distribution is itself multi-
# licensed BSD/GPL/Public-Domain — an ambiguous, DENY-classified transitive
# dependency under the tiered license policy (docs/11 §11.11), with no
# clean way to exclude just the tainted file. The Obsidian Desk terminal is
# built on plain FastAPI + Jinja2 + a native Starlette WebSocket instead —
# same "FastAPI for localhost" contract (docs/05 §5.7), no adapter needed.
# `ui` is the first extra "promoted" into the runtime license-gate scan
# (scripts/license_gate.py): as of M7 it is actually imported by src/lqe/ui,
# unlike data/models/search which remain research-only until their own
# milestone promotes them.
ui = [
  "fastapi",           # MIT — localhost app + WebSocket (M7)
  "uvicorn[standard]", # BSD-3 — ASGI server (M7)
  "jinja2",            # BSD-3 — server-rendered templates (M7)
]
dev = [
  "pytest",
  "hypothesis",
  "ruff",
  "mypy",
  "pip-licenses",
  "pre-commit",
]

[project.scripts]
lqe = "lqe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "scripts"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "ccxt.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyarrow's parquet read/write entrypoints aren't fully annotated;
# scoped narrowly to the modules that call into them.
module = ["lqe.storage.parquet", "lqe.storage.parquet_funding"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# The M6 heavy-lib structural adapters (docs/03 §3.3) lazily import
# optional "models"-extra packages that aren't installed in the base venv
# and/or ship no type stubs. Their own modules stay strict; only the
# missing-import noise from these specific third-party names is silenced.
module = [
  "statsmodels.*", "arch.*", "pypfopt.*", "skfolio.*", "riskfolio.*", "pandas.*",
  "hmmlearn.*", "ruptures.*", "sklearn.*", "lightgbm.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# optuna (the M8 search engine) ships no bundled type stubs; scoped to the
# one adapter module that touches it (autonomy/optimizer.py imports it lazily).
module = "optuna.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "llm_integration: exercises a real local Ollama server (docs/12 M16); auto-skips via skipif when 127.0.0.1:11434 isn't reachable, so no special flag is needed to run these on a machine that has Ollama installed.",
]
